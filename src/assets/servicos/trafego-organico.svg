<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 672" width="512" height="672" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="hsl(217,91%,60%)" stop-opacity="0.42"/>
      <stop offset="1" stop-color="hsl(217,91%,60%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="hsl(217,91%,60%)" opacity="0.16"/>
    </pattern>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f9ce34"/>
      <stop offset="0.5" stop-color="#ee2a7b"/>
      <stop offset="1" stop-color="#6228d7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(217,91%,55%)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="hsl(217,91%,35%)" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="512" height="672" fill="url(#bg)"/>
  <rect width="512" height="672" fill="url(#dots)"/>
  <rect width="512" height="672" fill="url(#glow)"/>

  <rect x="40" y="40" width="152" height="34" rx="17" fill="hsl(217,91%,60%)" fill-opacity="0.12" stroke="hsl(217,91%,60%)" stroke-opacity="0.35"/>
  <text x="60" y="63" fill="hsl(217,91%,72%)" font-size="15" font-weight="700" letter-spacing="2">SOCIAL MEDIA</text>

  <!-- perfil -->
  <g>
    <circle cx="80" cy="128" r="26" fill="none" stroke="url(#ig)" stroke-width="3"/>
    <circle cx="80" cy="128" r="19" fill="#12203a"/>
    <circle cx="80" cy="121" r="7" fill="#ffffff" fill-opacity="0.55"/>
    <path d="M68 140 a12 12 0 0 1 24 0 z" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="120" y="112" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="120" y="132" width="96" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="332" y="108" width="140" height="40" rx="12" fill="url(#ig)"/>
    <text x="402" y="134" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Seguir</text>
  </g>

  <!-- grade de posts -->
  <g>
    <rect x="40" y="180" width="136" height="136" rx="14" fill="url(#tile)"/>
    <rect x="188" y="180" width="136" height="136" rx="14" fill="url(#tile)" opacity="0.85"/>
    <rect x="336" y="180" width="136" height="136" rx="14" fill="url(#tile)" opacity="0.7"/>
    <rect x="40" y="328" width="136" height="136" rx="14" fill="url(#tile)" opacity="0.7"/>
    <rect x="188" y="328" width="136" height="136" rx="14" fill="url(#tile)" opacity="0.85"/>
    <rect x="336" y="328" width="136" height="136" rx="14" fill="url(#tile)"/>

    <!-- ícones dentro dos posts -->
    <path d="M108 262 c-24-16-36-28-36-42 a16 16 0 0 1 30-8 a16 16 0 0 1 30 8 c0 14-12 26-36 42 z" fill="#ffffff" fill-opacity="0.5"/>
    <g fill="#ffffff" fill-opacity="0.45">
      <rect x="222" y="222" width="68" height="46" rx="10"/>
      <path d="M236 268 l0 18 18-18 z"/>
    </g>
    <path d="M384 268 l24-32 20 26 14-16 22 28 z" fill="#ffffff" fill-opacity="0.45"/>
    <circle cx="404" cy="222" r="12" fill="#ffffff" fill-opacity="0.45"/>
    <g fill="#ffffff" fill-opacity="0.45">
      <rect x="84" y="374" width="48" height="6" rx="3"/>
      <rect x="72" y="392" width="72" height="6" rx="3"/>
      <rect x="88" y="410" width="40" height="6" rx="3"/>
    </g>
    <path d="M240 380 l32 22 -32 22 z" fill="#ffffff" fill-opacity="0.5"/>
    <path d="M388 420 c-20-14-30-24-30-35 a13 13 0 0 1 25-7 a13 13 0 0 1 25 7 c0 11-10 21-30 35 z" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="440" cy="390" r="10" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <rect x="40" y="486" width="56" height="4" rx="2" fill="hsl(217,91%,60%)"/>
  <text x="40" y="540" fill="#ffffff" font-size="36" font-weight="800">TRÁFEGO ORGÂNICO</text>
  <text x="40" y="582" fill="#ffffff" fill-opacity="0.62" font-size="20">Organização e engajamento</text>
  <text x="40" y="610" fill="#ffffff" fill-opacity="0.62" font-size="20">no Instagram</text>
</svg>
