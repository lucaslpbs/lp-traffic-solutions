    <path d="M110 232 C 150 232, 160 190, 200 190"/>
    <path d="M110 232 C 150 232, 160 274, 200 274"/>
    <path d="M282 190 C 322 190, 332 232, 372 232"/>
    <path d="M282 274 C 322 274, 332 232, 372 232"/>
  </g>
  <g>
