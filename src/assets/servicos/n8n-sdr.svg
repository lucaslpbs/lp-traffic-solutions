    <rect x="200" y="166" width="82" height="48" rx="12" fill="#0f1e34" stroke="hsl(217,91%,60%)" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="216" y="182" width="50" height="6" rx="3" fill="hsl(217,91%,60%)" fill-opacity="0.75"/>
    <rect x="216" y="194" width="32" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="200" y="250" width="82" height="48" rx="12" fill="#0f1e34" stroke="hsl(217,91%,60%)" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="216" y="266" width="50" height="6" rx="3" fill="hsl(217,91%,60%)" fill-opacity="0.75"/>
    <rect x="216" y="278" width="32" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="398" cy="232" r="26" fill="#0b1526" stroke="#25D366" stroke-width="3"/>
    <path d="M386 244 l3-9 a10 10 0 1 1 4 4 l-7 5 z" fill="#25D366"/>
  </g>

  <!-- balões de conversa -->
  <g>
    <rect x="96" y="326" width="196" height="46" rx="16" fill="#122a1e" stroke="#25D366" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="116" y="345" width="120" height="8" rx="4" fill="#25D366" fill-opacity="0.55"/>
