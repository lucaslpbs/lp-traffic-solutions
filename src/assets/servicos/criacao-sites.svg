    <text x="412" y="394" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Comprar</text>
  </g>

  <rect x="40" y="486" width="56" height="4" rx="2" fill="hsl(217,91%,60%)"/>
  <text x="40" y="540" fill="#ffffff" font-size="38" font-weight="800">CRIAÇÃO DE SITES</text>
  <text x="40" y="582" fill="#ffffff" fill-opacity="0.62" font-size="20">Aqui você tem o seu site</text>
  <text x="40" y="610" fill="#ffffff" fill-opacity="0.62" font-size="20">para vendas</text>
</svg>
