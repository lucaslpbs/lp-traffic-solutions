    <rect x="40" y="104" width="392" height="300" rx="16" fill="#0b1424" stroke="hsl(217,91%,60%)" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="40" y="104" width="392" height="38" rx="16" fill="#12203a"/>
    <rect x="40" y="130" width="392" height="12" fill="#12203a"/>
    <circle cx="64" cy="123" r="6" fill="#ff5f57"/>
    <circle cx="84" cy="123" r="6" fill="#febc2e"/>
    <circle cx="104" cy="123" r="6" fill="#28c840"/>
    <rect x="128" y="114" width="180" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>

    <rect x="60" y="162" width="352" height="118" rx="12" fill="url(#hero)"/>
    <rect x="80" y="188" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="80" y="210" width="128" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="80" y="234" width="112" height="30" rx="15" fill="hsl(217,91%,55%)"/>
    <text x="136" y="254" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Comprar</text>
    <circle cx="348" cy="222" r="34" fill="#ffffff" fill-opacity="0.12"/>

    <rect x="60" y="296" width="104" height="88" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="184" y="296" width="104" height="88" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="308" y="296" width="104" height="88" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="76" y="316" width="40" height="8" rx="4" fill="hsl(217,91%,60%)" fill-opacity="0.7"/>
    <rect x="200" y="316" width="40" height="8" rx="4" fill="hsl(217,91%,60%)" fill-opacity="0.7"/>
    <rect x="324" y="316" width="40" height="8" rx="4" fill="hsl(217,91%,60%)" fill-opacity="0.7"/>
    <rect x="76" y="336" width="72" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="200" y="336" width="72" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="324" y="336" width="72" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="76" y="354" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="200" y="354" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="324" y="354" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.15"/>
  </g>

  <!-- celular sobreposto -->
  <g>
    <rect x="352" y="228" width="120" height="216" rx="22" fill="#0b1424" stroke="hsl(217,91%,60%)" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="386" y="240" width="52" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="366" y="262" width="92" height="58" rx="10" fill="url(#hero)"/>
    <rect x="366" y="332" width="66" height="8" rx="4" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="366" y="350" width="48" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25"/>
