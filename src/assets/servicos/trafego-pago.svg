<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 672" width="512" height="672" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="hsl(217,91%,60%)" stop-opacity="0.42"/>
      <stop offset="1" stop-color="hsl(217,91%,60%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="hsl(217,91%,60%)" opacity="0.16"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="hsl(217,91%,45%)"/>
      <stop offset="1" stop-color="hsl(217,91%,68%)"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(217,91%,60%)" stop-opacity="0.35"/>
      <stop offset="1" stop-color="hsl(217,91%,60%)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="672" fill="url(#bg)"/>
  <rect width="512" height="672" fill="url(#dots)"/>
  <rect width="512" height="672" fill="url(#glow)"/>

  <rect x="40" y="40" width="152" height="34" rx="17" fill="hsl(217,91%,60%)" fill-opacity="0.12" stroke="hsl(217,91%,60%)" stroke-opacity="0.35"/>
  <text x="60" y="63" fill="hsl(217,91%,72%)" font-size="15" font-weight="700" letter-spacing="2">PERFORMANCE</text>

  <!-- KPIs -->
  <g>
    <rect x="40" y="98" width="204" height="76" rx="16" fill="#0f1e34" stroke="hsl(217,91%,60%)" stroke-opacity="0.28" stroke-width="2"/>
    <text x="60" y="128" fill="#ffffff" fill-opacity="0.5" font-size="15" letter-spacing="1">ROI</text>
    <text x="60" y="158" fill="#ffffff" font-size="28" font-weight="800">4,8x</text>
    <path d="M206 148 l12-16 12 16 z" fill="#22c55e"/>

    <rect x="268" y="98" width="204" height="76" rx="16" fill="#0f1e34" stroke="hsl(217,91%,60%)" stroke-opacity="0.28" stroke-width="2"/>
    <text x="288" y="128" fill="#ffffff" fill-opacity="0.5" font-size="15" letter-spacing="1">CUSTO POR LEAD</text>
    <text x="288" y="158" fill="#ffffff" font-size="28" font-weight="800">-62%</text>
    <path d="M434 132 l12 16 12-16 z" fill="#22c55e"/>
  </g>

  <!-- gráfico -->
  <g>
    <path d="M56 392 L56 340 L128 300 L200 316 L272 246 L344 214 L416 158 L456 158 L456 392 Z" fill="url(#area)"/>
    <polyline points="56,340 128,300 200,316 272,246 344,214 416,158" fill="none" stroke="hsl(217,91%,64%)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="416" cy="158" r="8" fill="hsl(217,91%,68%)" stroke="#05070d" stroke-width="3"/>

    <g fill="url(#bar)">
      <rect x="56" y="330" width="46" height="62" rx="8" opacity="0.55"/>
      <rect x="128" y="304" width="46" height="88" rx="8" opacity="0.65"/>
      <rect x="200" y="286" width="46" height="106" rx="8" opacity="0.75"/>
      <rect x="272" y="256" width="46" height="136" rx="8" opacity="0.85"/>
      <rect x="344" y="222" width="46" height="170" rx="8" opacity="0.92"/>
      <rect x="416" y="180" width="46" height="212" rx="8"/>
    </g>
    <rect x="40" y="404" width="432" height="2" rx="1" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <rect x="40" y="486" width="56" height="4" rx="2" fill="hsl(217,91%,60%)"/>
  <text x="40" y="540" fill="#ffffff" font-size="40" font-weight="800">TRÁFEGO PAGO</text>
  <text x="40" y="582" fill="#ffffff" fill-opacity="0.62" font-size="20">Todas as soluções para o seu</text>
  <text x="40" y="610" fill="#ffffff" fill-opacity="0.62" font-size="20">baixo desempenho nas redes</text>
  <text x="40" y="638" fill="#ffffff" fill-opacity="0.62" font-size="20">são aqui</text>
</svg>
