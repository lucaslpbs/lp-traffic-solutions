<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Kommo CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f8fa;
  --paper:#ffffff;
  --ink:#0f172a;
  --ink-soft:#64748b;
  --ink-faint:#94a3b8;
  --line:#e7eaf0;
  --accent:#4f46e5;
  --accent-soft:#eef0fd;
  --accent-deep:#3730a3;
  --green:#16a34a;
  --green-soft:#e9f7ee;
  --red:#dc2626;
  --red-soft:#fdeded;
  --amber:#d97706;
  --amber-soft:#fef3e1;
  --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
.wrap{max-width:1280px;margin:0 auto;padding:32px 28px 80px;}

/* ===== TOPBAR ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px; flex-wrap:wrap; gap:14px;
}
.brand{display:flex; align-items:center; gap:11px;}
.brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg, var(--accent), #7c72f0);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#fff; font-size:14px; flex-shrink:0;
}
.brand h1{font-size:16.5px; font-weight:700; margin:0; letter-spacing:-0.01em;}
.brand .meta{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}
.topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.range-pill{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--paper); border:1px solid var(--line);
  border-radius:9px; padding:8px 14px; font-size:12.5px; color:var(--ink-soft);
  box-shadow:var(--shadow);
}
.range-pill b{color:var(--ink); font-weight:600;}
.dot-live{width:7px;height:7px;border-radius:50%; background:var(--green); display:inline-block;}

.upload-btn{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--ink); color:#fff; border:none; border-radius:9px;
  padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
  box-shadow:var(--shadow); font-family:inherit;
}
.upload-btn:hover{background:#1e293b;}
.upload-btn svg{width:14px;height:14px;}

/* ===== FILTER BAR ===== */
.filter-bar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--paper); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin-bottom:22px; box-shadow:var(--shadow);
}
.filter-label{font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-right:2px;}
.chip{
  border:1px solid var(--line); background:#fafbfd; color:var(--ink-soft);
  border-radius:999px; padding:6px 13px; font-size:12px; font-weight:600;
  cursor:pointer; font-family:inherit; transition:all .1s;
}
.chip:hover{background:#f1f2f6;}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.filter-sep{width:1px; height:20px; background:var(--line); margin:0 4px;}
.date-input{
  border:1px solid var(--line); border-radius:8px; padding:5px 9px; font-size:12px;
  font-family:inherit; color:var(--ink); background:#fafbfd;
}
.filter-status{margin-left:auto; font-size:11.5px; color:var(--ink-faint);}

/* ===== EMPTY STATE ===== */
.empty-state{
  background:var(--paper); border:1px dashed var(--line); border-radius:14px;
  padding:60px 30px; text-align:center; color:var(--ink-faint); font-size:13px;
}

/* ===== KPI ROW ===== */
.kpi-row{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px;}
.kpi-card{
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:18px 18px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.kpi-card .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; justify-content:space-between;}
.kpi-card .val{font-size:26px; font-weight:800; letter-spacing:-0.02em; margin-top:8px; color:var(--ink);}
.kpi-card .delta{font-size:11.5px; font-weight:700; margin-top:6px; display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:6px;}
.delta.up{background:var(--green-soft); color:var(--green);}
.delta.down{background:var(--red-soft); color:var(--red);}
.delta.flat{background:var(--accent-soft); color:var(--accent-deep);}

/* ===== GRID LAYOUT ===== */
.grid{display:grid; gap:14px;}
.g-2{grid-template-columns:1.5fr 1fr;}
.g-3{grid-template-columns:1fr 1fr 1fr;}
.g-12{grid-template-columns:7fr 5fr;}

.panel{
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:20px 20px 18px; box-shadow:var(--shadow);
}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px;}
.panel-head h3{font-size:13.5px; font-weight:700; margin:0; color:var(--ink);}
.panel-head .note{font-size:11.5px; color:var(--ink-faint);}
.panel-foot{font-size:11.5px; color:var(--ink-faint); margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}

section{margin-top:22px;}
.section-title{font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
.section-title::after{content:""; flex:1; height:1px; background:var(--line);}

/* ===== FUNNEL ROWS ===== */
.funnel-row{display:flex; align-items:center; gap:10px; margin-bottom:11px;}
.funnel-row:last-child{margin-bottom:0;}
.funnel-label{width:96px; font-size:12px; font-weight:600; flex-shrink:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.funnel-bar-bg{flex:1; height:22px; background:#f1f2f6; border-radius:6px; overflow:hidden; display:flex;}
.funnel-seg{height:100%; display:flex; align-items:center; justify-content:center; font-size:10.5px; color:#fff; font-weight:700;}
.seg-ganho{background:var(--green);}
.seg-andamento{background:var(--accent);}
.seg-perdido{background:#cbd2e0;}
.funnel-total{width:38px; text-align:right; font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0;}

.legend-row{display:flex; gap:16px; margin-top:12px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
.legend-row span{display:inline-flex; align-items:center; gap:5px;}
.lgd-dot{width:8px;height:8px;border-radius:50%; display:inline-block; flex-shrink:0;}

/* ===== BARS ===== */
.bars{display:flex; align-items:flex-end; gap:3px; height:120px;}
.bars .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:2px;}
.bars .col .b{width:100%; border-radius:2px 2px 0 0; background:var(--accent); min-height:2px;}
.bars .col.we .b{background:#c7cbf5;}
.bars .col .t{font-size:8.5px; color:var(--ink-faint); margin-top:5px;}

.bars-h{display:flex; align-items:flex-end; gap:5px; height:100px;}
.bars-h .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%;}
.bars-h .col .b{width:100%; border-radius:3px 3px 0 0; background:var(--accent);}
.bars-h .col .t{font-size:9.5px; color:var(--ink-faint); margin-top:4px;}

/* ===== HOUR HEAT ===== */
.hour-grid{display:grid; grid-template-columns:repeat(12,1fr); gap:4px;}
.hcell{aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700;}

/* ===== TABLE ===== */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:0 8px 8px; border-bottom:1px solid var(--line); font-weight:700;}
td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.num-cell{text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
.rank-pill{
  width:20px;height:20px;border-radius:6px; background:var(--accent-soft); color:var(--accent-deep);
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;
}

/* ===== RESPONSAVEIS ===== */
.resp-row{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line);}
.resp-row:last-child{border-bottom:none; padding-bottom:0;}
.resp-row:first-child{padding-top:0;}
.resp-avatar{
  width:32px;height:32px;border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:12px;
}
.resp-info{flex:1; min-width:0;}
.resp-name{font-weight:700; font-size:12.5px;}
.resp-meta{font-size:11px; color:var(--ink-faint); margin-top:1px;}
.resp-bar-bg{height:5px; background:#f1f2f6; border-radius:3px; margin-top:5px; overflow:hidden;}
.resp-bar{height:100%; border-radius:3px;}
.resp-revenue{text-align:right; font-weight:800; font-size:13.5px; color:var(--ink); flex-shrink:0;}

/* ===== LOSS BARS ===== */
.loss-row{margin-bottom:11px;}
.loss-row:last-child{margin-bottom:0;}
.loss-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
.loss-bar-bg{height:7px; background:#f1f2f6; border-radius:4px; overflow:hidden;}
.loss-bar{height:100%; border-radius:4px;}

/* ===== STAT MINI GRID ===== */
.stat-mini{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stat-mini .box{background:#fafbfd; border:1px solid var(--line); border-radius:10px; padding:12px 14px; text-align:center;}
.stat-mini .box .n{font-size:19px; font-weight:800; color:var(--ink);}
.stat-mini .box .l{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}

footer{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-faint); text-align:center;}

@media (max-width:1100px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-3,.g-12{grid-template-columns:1fr;}
  .hour-grid{grid-template-columns:repeat(8,1fr);}
  .filter-status{margin-left:0; width:100%;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="mark">K</div>
      <div>
        <h1>Funil de Vendas — Kommo</h1>
        <div class="meta" id="brand-meta">Carregando…</div>
      </div>
    </div>
    <div class="topbar-right">
      <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
      <button class="upload-btn" id="upload-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Carregar planilha
      </button>
      <div class="range-pill"><span class="dot-live"></span><span id="range-pill-text">—</span></div>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <span class="filter-label">Período</span>
    <button class="chip active" data-preset="all">Tudo</button>
    <button class="chip" data-preset="7">Últimos 7 dias</button>
    <button class="chip" data-preset="14">Últimos 14 dias</button>
    <button class="chip" data-preset="30">Últimos 30 dias</button>
    <button class="chip" data-preset="month">Este mês</button>
    <div class="filter-sep"></div>
    <input type="date" class="date-input" id="date-from">
    <span style="color:var(--ink-faint); font-size:12px;">até</span>
    <input type="date" class="date-input" id="date-to">
    <div class="filter-status" id="filter-status"></div>
  </div>

  <div id="dashboard-content">
    <div class="empty-state" id="empty-state">Carregando planilha…</div>
  </div>

  <footer id="footer-text">Kommo CRM</footer>
</div>

<script>
/* ==================== CONFIG ==================== */
// Se este arquivo estiver hospedado num servidor junto com uma planilha
// chamada abaixo, ela é carregada automaticamente ao abrir a página.
// Se não encontrar (ex.: arquivo aberto direto do computador), usa a
// planilha embutida como padrão — clique em "Carregar planilha" a qualquer
// momento para atualizar com um novo export do Kommo.
const AUTO_FETCH_PATH = './kommo_export_leads.xlsx';

/* ==================== PARSING (client-side, via SheetJS) ==================== */
function parseDateStr(raw) {
  const s = String(raw ?? '').trim();
  const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, dd, mm, yyyy, hh, min, ss] = m;
  return new Date(+yyyy, +mm - 1, +dd, +hh, +min, +ss);
}

function classifyStatus(etapaRaw) {
  const e = String(etapaRaw || '').toLowerCase().trim();
  if (e.includes('perdid')) return 'perdido';
  if (e.includes('ganh')) return 'ganho';   // pega "ganho" E "ganha"
  if (e.includes('pago')) return 'ganho';
  return 'andamento';
}

function extractMotivo(etapaRaw) {
  const m = String(etapaRaw || '').match(/\((.*)\)/);
  return m ? m[1].trim() : null;
}

const FUNNEL_DISPLAY_NAMES = {
  'funil contato inicial': 'Contato Inicial',
  'funil duda': 'DUDA',
  'funil nara': 'NARA',
  'funil fran': 'FRAN',
  'funil eva': 'EVA',
  'funil mary jane': 'Mary Jane',
  'funil numero antigo': 'Núm. Antigo',
};
function prettifyFunnelName(name) {
  const key = String(name || '').toLowerCase().trim();
  return FUNNEL_DISPLAY_NAMES[key] || String(name || '(sem funil)');
}

// Regra validada em conversas anteriores: os valores de "Venda" exportados
// pelo Kommo vêm sempre multiplicados por 100 (em centavos), inclusive para
// valores pequenos/redondos. Basta dividir por 100 de forma uniforme.
function parseVenda(raw) {
  const n = Number(raw) || 0;
  return n === 0 ? 0 : n / 100;
}

function parseLeads(rows) {
  return rows.map(row => {
    const etapa = String(row['Etapa do lead'] ?? '').trim();
    return {
      id: String(row['ID'] ?? ''),
      nome: String(row['Contato principal'] ?? '').trim() || '(sem nome)',
      etapa,
      funil: prettifyFunnelName(row['Funil de vendas']),
      responsavel: String(row['Lead usuário responsável'] ?? '').trim() || '(sem responsável)',
      dataCriada: parseDateStr(row['Data Criada']),
      venda: parseVenda(row['Venda']),
      status: classifyStatus(etapa),
      motivo: extractMotivo(etapa),
    };
  }).filter(l => l.dataCriada !== null);
}

function workbookToLeads(arrayBuffer) {
  const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellDates: false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  return parseLeads(rows);
}

/* ==================== AGGREGATIONS (sobre o subconjunto filtrado) ==================== */
function computeKPIs(leads) {
  const total = leads.length;
  const ganhoLeads = leads.filter(l => l.status === 'ganho');
  const perdido = leads.filter(l => l.status === 'perdido').length;
  const ganho = ganhoLeads.length;
  const andamento = total - ganho - perdido;
  const receita = ganhoLeads.reduce((s, l) => s + l.venda, 0);
  const comValor = ganhoLeads.filter(l => l.venda > 0).length;
  return {
    total, ganho, perdido, andamento, receita,
    ticketMedio: comValor ? receita / comValor : 0,
    taxaConversao: total ? (ganho / total) * 100 : 0,
    taxaPerda: total ? (perdido / total) * 100 : 0,
  };
}

function computeFunnels(leads) {
  const map = new Map();
  for (const l of leads) {
    const e = map.get(l.funil) || { nome: l.funil, total: 0, ganho: 0, perdido: 0, andamento: 0 };
    e.total++;
    if (l.status === 'ganho') e.ganho++;
    else if (l.status === 'perdido') e.perdido++;
    else e.andamento++;
    map.set(l.funil, e);
  }
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

const RESP_COLORS = ['#4f46e5', '#0891b2', '#d97706', '#dc2626', '#7c3aed', '#059669', '#64748b', '#db2777'];
function computeAttendants(leads) {
  const map = new Map();
  for (const l of leads) {
    const e = map.get(l.responsavel) || { nome: l.responsavel, total: 0, ganho: 0, receita: 0 };
    e.total++;
    if (l.status === 'ganho') { e.ganho++; e.receita += l.venda; }
    map.set(l.responsavel, e);
  }
  const arr = Array.from(map.values()).sort((a, b) => b.total - a.total);
  arr.forEach((r, i) => { r.color = RESP_COLORS[i % RESP_COLORS.length]; });
  return arr;
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function computeDaily(leads) {
  const map = new Map();
  for (const l of leads) {
    const k = dateKey(l.dataCriada);
    map.set(k, (map.get(k) || 0) + 1);
  }
  return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
}

const DOW_LABELS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function computeDOW(leads) {
  const counts = new Array(7).fill(0);
  for (const l of leads) counts[l.dataCriada.getDay()]++;
  const order = [1, 2, 3, 4, 5, 6, 0]; // Seg..Dom
  return order.map(i => ({ label: DOW_LABELS[i], count: counts[i], weekend: i === 0 || i === 6 }));
}

function computeHour(leads) {
  const counts = new Array(24).fill(0);
  for (const l of leads) counts[l.dataCriada.getHours()]++;
  return counts;
}

function computeLossReasons(leads) {
  const map = new Map();
  for (const l of leads) {
    if (l.status !== 'perdido') continue;
    const m = l.motivo || 'Não especificado';
    map.set(m, (map.get(m) || 0) + 1);
  }
  return Array.from(map.entries()).sort((a, b) => b[1] - a[1]);
}

function computeTopSales(leads, n) {
  return leads.filter(l => l.status === 'ganho' && l.venda > 0)
    .sort((a, b) => b.venda - a.venda)
    .slice(0, n);
}

/* ==================== FORMAT HELPERS ==================== */
function brl(v) { return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { return d.toLocaleDateString('pt-BR'); }
function fmtDateShort(d) { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }
function toInputDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* ==================== STATE ==================== */
let ALL_LEADS = [];
let SOURCE_LABEL = '';
let currentFrom = null;
let currentTo = null;
let renderToken = 0;

/* ==================== RENDER ==================== */
function render() {
  const myToken = ++renderToken;
  const filtered = ALL_LEADS.filter(l => l.dataCriada >= currentFrom && l.dataCriada <= currentTo);
  const content = document.getElementById('dashboard-content');

  if (ALL_LEADS.length === 0) {
    content.innerHTML = '<div class="empty-state">Nenhuma planilha carregada. Clique em "Carregar planilha" no topo para começar.</div>';
    return;
  }
  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state">Nenhum lead encontrado no período selecionado.</div>';
    document.getElementById('filter-status').textContent = '0 leads no período';
    return;
  }

  const kpi = computeKPIs(filtered);
  const funis = computeFunnels(filtered);
  const resp = computeAttendants(filtered);
  const daily = computeDaily(filtered);
  const dow = computeDOW(filtered);
  const hour = computeHour(filtered);
  const loss = computeLossReasons(filtered);
  const top = computeTopSales(filtered, 10);

  document.getElementById('filter-status').textContent = `${filtered.length.toLocaleString('pt-BR')} leads no período selecionado`;

  content.innerHTML = buildDashboardHTML(kpi, funis, resp, daily, dow, hour, loss, top);

  // gráficos que dependem do DOM já inserido — só renderiza se ainda for o render mais recente
  setTimeout(() => {
    if (myToken !== renderToken) return;
    renderDayChart(daily);
    renderDOWChart(dow);
    renderHourGrid(hour);
    renderLossBars(loss, kpi.perdido);
    renderTopSales(top);
  }, 0);
}

function buildDashboardHTML(kpi, funis, resp, daily, dow, hour, loss, top) {
  const pctAndamento = kpi.total ? Math.round(kpi.andamento / kpi.total * 100) : 0;
  const pctPerdido = kpi.total ? Math.round(kpi.perdido / kpi.total * 100) : 0;
  const pctGanho = kpi.total ? (kpi.ganho / kpi.total * 100) : 0;

  // KPI ROW
  let html = `<div class="kpi-row">
    <div class="kpi-card">
      <div class="lbl">Total de leads</div>
      <div class="val">${kpi.total.toLocaleString('pt-BR')}</div>
      <div class="delta flat">no período</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Receita confirmada</div>
      <div class="val">R$ ${brl(kpi.receita)}</div>
      <div class="delta up">${kpi.ganho} venda${kpi.ganho===1?'':'s'}</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Ticket médio</div>
      <div class="val">R$ ${brl(kpi.ticketMedio)}</div>
      <div class="delta flat">por venda</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Taxa de conversão</div>
      <div class="val">${kpi.taxaConversao.toFixed(1).replace('.',',')}%</div>
      <div class="delta down">${kpi.ganho} / ${kpi.total}</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Taxa de perda</div>
      <div class="val">${kpi.taxaPerda.toFixed(1).replace('.',',')}%</div>
      <div class="delta down">${kpi.perdido.toLocaleString('pt-BR')} leads</div>
    </div>
  </div>`;

  // FUNIS
  html += `<section><div class="section-title">Funis</div><div class="grid g-12">
    <div class="panel">
      <div class="panel-head"><h3>Status por funil</h3><span class="note">ganho · em andamento · perdido</span></div>
      <div>`;
  funis.forEach(f => {
    const pg = f.total ? f.ganho/f.total*100:0, pa = f.total ? f.andamento/f.total*100:0, pp = f.total ? f.perdido/f.total*100:0;
    html += `<div class="funnel-row">
      <div class="funnel-label" title="${f.nome}">${f.nome}</div>
      <div class="funnel-bar-bg">
        ${pg>0?`<div class="funnel-seg seg-ganho" style="width:${pg}%">${f.ganho}</div>`:''}
        ${pa>0?`<div class="funnel-seg seg-andamento" style="width:${pa}%">${f.andamento}</div>`:''}
        ${pp>0?`<div class="funnel-seg seg-perdido" style="width:${pp}%; color:#475569;">${f.perdido}</div>`:''}
      </div>
      <div class="funnel-total">${f.total}</div>
    </div>`;
  });
  html += `</div>
      <div class="legend-row">
        <span><span class="lgd-dot" style="background:var(--green)"></span>Ganho</span>
        <span><span class="lgd-dot" style="background:var(--accent)"></span>Em andamento</span>
        <span><span class="lgd-dot" style="background:#cbd2e0"></span>Perdido</span>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Distribuição geral</h3></div>
      <div class="stat-mini">
        <div class="box"><div class="n" style="color:var(--green)">${kpi.ganho}</div><div class="l">Ganho</div></div>
        <div class="box"><div class="n" style="color:var(--accent)">${kpi.andamento.toLocaleString('pt-BR')}</div><div class="l">Em andamento</div></div>
        <div class="box"><div class="n" style="color:var(--ink-faint)">${kpi.perdido.toLocaleString('pt-BR')}</div><div class="l">Perdido</div></div>
      </div>
      <div class="panel-foot">${pctAndamento}% da base ainda sem desfecho · ${pctPerdido}% perdido · ${pctGanho.toFixed(1).replace('.',',')}% ganho</div>
    </div>
  </div></section>`;

  // EQUIPE
  const totalReceita = resp.reduce((s,r)=>s+r.receita,0);
  let donutGrad = '#eef0f5 0% 100%';
  if (totalReceita > 0) {
    let acc = 0, parts = [];
    resp.filter(r=>r.receita>0).forEach(r => {
      const start = acc/totalReceita*100;
      acc += r.receita;
      const end = acc/totalReceita*100;
      parts.push(`${r.color} ${start}% ${end}%`);
    });
    donutGrad = parts.join(', ');
  }
  const topResp = resp.filter(r=>r.receita>0).sort((a,b)=>b.receita-a.receita)[0];
  const topRespPct = topResp && totalReceita ? Math.round(topResp.receita/totalReceita*100) : 0;

  html += `<section><div class="section-title">Equipe</div><div class="grid g-2">
    <div class="panel">
      <div class="panel-head"><h3>Performance por responsável</h3><span class="note">leads · vendas · receita</span></div>

    html += `<div class="resp-row">
      <div class="resp-avatar" style="background:${r.color}">${initials}</div>
      <div class="resp-info">
        <div class="resp-name">${r.nome}</div>

      </div>
      <div class="resp-revenue">R$ ${brl(r.receita)}</div>

    <div class="panel">
      <div class="panel-head"><h3>Concentração de receita</h3></div>
      <div style="display:flex; align-items:center; gap:18px;">
        <div style="width:108px;height:108px;border-radius:50%; background:conic-gradient(${donutGrad}); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <div style="width:76px;height:76px;border-radius:50%; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div style="font-size:18px; font-weight:800; color:var(--accent-deep);">${topRespPct}%</div>
            <div style="font-size:8.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; text-align:center;">${topResp?topResp.nome:'—'}</div>
          </div>
        </div>
        <div style="font-size:12px; color:var(--ink-soft); line-height:1.8; min-width:0;">`;
  resp.filter(r=>r.receita>0).sort((a,b)=>b.receita-a.receita).forEach(r=>{
    html += `<div><span class="lgd-dot" style="background:${r.color}"></span> ${r.nome} — R$ ${brl(r.receita)}</div>`;
  });
  if (resp.filter(r=>r.receita>0).length===0) html += `<div style="color:var(--ink-faint)">Nenhuma venda confirmada no período.</div>`;
  html += `</div>
      </div>
      <div class="panel-foot">${resp.length} responsáve${resp.length===1?'l':'is'} com leads no período</div>
    </div>
  </div></section>`;

  // TEMPO
  html += `<section><div class="section-title">Volume no tempo</div><div class="grid g-3">
    <div class="panel"><div class="panel-head"><h3>Por dia</h3></div><div class="bars" id="day-chart"></div></div>
    <div class="panel"><div class="panel-head"><h3>Por dia da semana</h3></div><div class="bars-h" id="dow-chart"></div></div>
    <div class="panel"><div class="panel-head"><h3>Por hora do dia</h3></div><div class="hour-grid" id="hour-grid"></div></div>
  </div></section>`;

  // PERDAS E VENDAS
  html += `<section><div class="section-title">Receita e perdas</div><div class="grid g-2">
    <div class="panel">
      <div class="panel-head"><h3>Motivos de perda</h3><span class="note">${kpi.perdido.toLocaleString('pt-BR')} leads perdidos</span></div>
      <div id="loss-bars"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Top ${top.length} vendas</h3><span class="note">etapas "ganho/ganha"</span></div>
      <table id="top-sales"></table>
    </div>
  </div></section>`;

  return html;
}

function renderDayChart(daily) {
  const el = document.getElementById('day-chart');
  if (!el) return;
  const max = Math.max(...daily.map(d=>d[1]), 1);
  const labelEvery = Math.max(1, Math.ceil(daily.length/15));
  let html='';
  daily.forEach(([k,c],i)=>{
    const d = new Date(k+'T00:00:00');
    const we = d.getDay()===0 || d.getDay()===6;
    const h = c/max*100;
    const showLabel = i%labelEvery===0;
    html+=`<div class="col ${we?'we':''}" title="${fmtDateShort(d)}: ${c} leads">
      <div class="b" style="height:${h}%"></div>
      <div class="t">${showLabel?fmtDateShort(d).split('/')[0]:''}</div>
    </div>`;
  });
  el.innerHTML=html;
}

function renderDOWChart(dow) {
  const el = document.getElementById('dow-chart');
  if (!el) return;
  const max = Math.max(...dow.map(d=>d.count), 1);
  let html='';
  dow.forEach(d=>{
    const h = d.count/max*100;
    html+=`<div class="col ${d.weekend?'we':''}" title="${d.label}: ${d.count} leads">
      <div class="b" style="height:${h}%"></div>
      <div class="t">${d.label}</div>
    </div>`;
  });
  el.innerHTML=html;
}

function renderHourGrid(hour) {
  const el = document.getElementById('hour-grid');
  if (!el) return;
  const max = Math.max(...hour, 1);
  let html='';
  hour.forEach((c,h)=>{
    const t=c/max;
    const bg = `rgba(79,70,229,${0.08+t*0.85})`;
    const tc = t>0.45 ? '#fff' : '#475569';
    html+=`<div class="hcell" style="background:${bg}; color:${tc};" title="${h}h: ${c} leads">${h}</div>`;
  });
  el.innerHTML=html;
}

function renderLossBars(loss, totalPerdido) {
  const el = document.getElementById('loss-bars');
  if (!el) return;
  if (loss.length===0) { el.innerHTML = '<div style="color:var(--ink-faint); font-size:12.5px;">Nenhum lead perdido no período.</div>'; return; }
  const max = Math.max(...loss.map(l=>l[1]));
  let html='';
  loss.forEach(([m,c])=>{
    const w = c/max*100;
    const isUnspec = m==='Não especificado';
    html+=`<div class="loss-row">
      <div class="loss-top"><span style="${isUnspec?'color:var(--red); font-weight:700;':''}">${m}</span><span style="font-weight:700;">${c}</span></div>
      <div class="loss-bar-bg"><div class="loss-bar" style="width:${w}%; background:${isUnspec?'var(--red)':'var(--accent)'}"></div></div>
    </div>`;
  });
  el.innerHTML=html;
}

function renderTopSales(top) {
  const el = document.getElementById('top-sales');
  if (!el) return;
  if (top.length===0) { el.innerHTML = '<tr><td style="color:var(--ink-faint); font-size:12.5px; padding:8px 0;">Nenhuma venda confirmada no período.</td></tr>'; return; }
  let html = '<thead><tr><th></th><th>Cliente</th><th style="text-align:right;">Valor</th></tr></thead><tbody>';
  top.forEach((v,i)=>{
    html+=`<tr><td><span class="rank-pill">${i+1}</span></td><td>${v.nome}</td><td class="num-cell">R$ ${brl(v.venda)}</td></tr>`;
  });
  html+='</tbody>';
  el.innerHTML=html;
}

/* ==================== FILTER CONTROL ==================== */
function applyPreset(preset) {
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.preset===preset));
  const dates = ALL_LEADS.map(l=>l.dataCriada);
  const minDate = new Date(Math.min(...dates));
  const maxDate = new Date(Math.max(...dates));
  let from = minDate, to = maxDate;
  const endOfDay = d => { const x=new Date(d); x.setHours(23,59,59,999); return x; };
  const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };

  if (preset==='all') { from = startOfDay(minDate); to = endOfDay(maxDate); }
  else if (preset==='7' || preset==='14' || preset==='30') {
    const n = parseInt(preset,10);
    to = endOfDay(maxDate);
    from = startOfDay(new Date(maxDate.getTime() - (n-1)*86400000));
  } else if (preset==='month') {
    from = startOfDay(new Date(maxDate.getFullYear(), maxDate.getMonth(), 1));
    to = endOfDay(maxDate);
  }
  currentFrom = from; currentTo = to;
  document.getElementById('date-from').value = toInputDate(from);
  document.getElementById('date-to').value = toInputDate(to);
  updateRangePill();
  render();
}

function applyCustomRange() {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  const fromVal = document.getElementById('date-from').value;
  const toVal = document.getElementById('date-to').value;
  if (!fromVal || !toVal) return;
  currentFrom = new Date(fromVal+'T00:00:00');
  currentTo = new Date(toVal+'T23:59:59');
  updateRangePill();
  render();
}

function updateRangePill() {
  document.getElementById('range-pill-text').innerHTML =
    `${fmtDate(currentFrom)} – ${fmtDate(currentTo)} &nbsp;·&nbsp; <b>${ALL_LEADS.length.toLocaleString('pt-BR')}</b> leads na base`;
}

/* ==================== LOAD FLOW ==================== */
function onLeadsLoaded(leads, sourceLabel) {
  ALL_LEADS = leads;
  SOURCE_LABEL = sourceLabel;
  const dates = leads.map(l=>l.dataCriada);
  const minDate = new Date(Math.min(...dates));
  const maxDate = new Date(Math.max(...dates));
  document.getElementById('date-from').min = toInputDate(minDate);
  document.getElementById('date-from').max = toInputDate(maxDate);
  document.getElementById('date-to').min = toInputDate(minDate);
  document.getElementById('date-to').max = toInputDate(maxDate);
  document.getElementById('brand-meta').textContent = `Atualizado em ${new Date().toLocaleDateString('pt-BR')} · ${sourceLabel}`;
  document.getElementById('footer-text').textContent = `Kommo CRM · ${sourceLabel} · ${leads.length.toLocaleString('pt-BR')} registros`;
  applyPreset('all');
}

function loadFromArrayBuffer(buf, sourceLabel) {
  try {
    const leads = workbookToLeads(buf);
    if (leads.length === 0) {
      alert('Não encontrei linhas com data válida nessa planilha. Confira se é um export do Kommo no formato esperado.');
      return;
    }
    onLeadsLoaded(leads, sourceLabel);
  } catch (err) {
    console.error(err);
    alert('Não consegui ler essa planilha. Detalhe: ' + err.message);
  }
}

// upload manual
document.getElementById('upload-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadFromArrayBuffer(ev.target.result, file.name);
  reader.readAsArrayBuffer(file);
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => applyPreset(chip.dataset.preset));
});
document.getElementById('date-from').addEventListener('change', applyCustomRange);
document.getElementById('date-to').addEventListener('change', applyCustomRange);
